name: docker-ghcr

# Builds the multi-arch app image with the same Dockerfile that docker-compose
# uses and publishes it to GitHub Container Registry (ghcr.io) under this repo's
# owner. Uses the built-in GITHUB_TOKEN, so no external registry secrets are
# needed — works out of the box on a fork.

on:
    push:
        branches: ['**']
        tags: ['v*']
        paths-ignore:
            - '**.md'
            - 'docs/**'
    workflow_dispatch: # allow manual builds from the Actions tab

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # required to push to GHCR
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata (tags/labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/open-archiver
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./apps/open-archiver/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
